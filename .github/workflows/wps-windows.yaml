name: Windows WPS fix

on:
  push:
    branches: [fix/wps-download]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wps-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - name: Build frontend
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Test downloads
        working-directory: src-tauri
        run: cargo test --release --features custom-protocol --lib --locked
      - name: Build Windows application
        working-directory: src-tauri
        run: cargo build --release --features custom-protocol --bin app --locked
      - name: Collect application and local integration test runner
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/app.exe -Destination artifacts/ZLA-WPS-fix.exe
          Copy-Item -LiteralPath LICENSE -Destination artifacts/LICENSE.txt
          $testRunner = Get-ChildItem -Path src-tauri/target/release/deps/app_lib-*.exe | Select-Object -First 1
          if (!$testRunner) { throw 'Download test runner was not generated' }
          Copy-Item -LiteralPath $testRunner.FullName -Destination artifacts/zla-download-tests.exe
          Get-FileHash artifacts/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ZLA-WPS-fix-windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
